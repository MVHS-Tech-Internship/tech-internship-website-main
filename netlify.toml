[build]
  command = "pip install -r requirements.txt && python build_static.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# main.py redirects these two routes; there is no server on Netlify to do it.
[[redirects]]
  from = "/about"
  to = "/about/overview"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blogs"
  status = 301

# Old team URLs -> the Tech Interns page.
[[redirects]]
  from = "/about/team"
  to = "/tech-interns"
  status = 301

[[redirects]]
  from = "/meet-the-team"
  to = "/tech-interns"
  status = 301

# Templates that exist in templates/ but have no route in main.py.
# They 404 on Flask too — pointed somewhere useful rather than left dead.
[[redirects]]
  from = "/support"
  to = "/donations"
  status = 302

[[redirects]]
  from = "/impact"
  to = "/about/overview"
  status = 302

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
