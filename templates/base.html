<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MVHS Tech Internship{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>
        <div class="container">
            <nav>
                <a href="/" class="logo-link" style="text-decoration: none; color: inherit;">
                    <div class="logo">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="MVHS Logo" class="logo-image">
                        <span class="logo-text">MVHS Tech Internship</span>
                    </div>
                </a>
                <ul class="nav-links">
                    <li><a href="/about" class="{% if request.path == '/' %}active{% endif %}">About Us</a></li>
                    <li><a href="/news" class="{% if request.path == '/' %}active{% endif %}">News & Media</a></li>
                    <li><a href="/resources" class="{% if request.path == '/' %}active{% endif %}">Resources</a></li>
                    <li><a href="/contact" class="{% if request.path == '/' %}active{% endif %}">Contact Us</a></li>
                    <li><a href="/support" class="{% if request.path == '/' %}active{% endif %}">Support Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-left">
                <p>&copy; 2025 MVHS Tech Internship. All rights reserved.</p>
                <p>Empowering minds, shaping futures.</p>
            </div>
            <div class="footer-right">
                <a href="https://instagram.com/mvhs.tech" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com/company/mvhs-principal-s-tech-internship/" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="mailto:mvhs.tech24@gmail.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
